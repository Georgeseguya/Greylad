function settingsView(){return `<div class="settingsgrid"><section class="panel"><h2>Business profile</h2><p class="subtle">Used on receipts and customer messages</p><div class="fields" style="margin-top:20px">${fname('bizname','Business name','text',db.settings.business)}${fname('bizphone','Business contact','tel',db.settings.phone)}${fname('bizlocation','Business location','text',db.settings.location)}</div><div style="margin-top:15px"><button class="btn primary" id="saveprofile">Save profile</button></div></section><section class="panel"><h2>Keep your records safe</h2><p class="subtle">Data is stored only in this browser until you export it. Clearing browser data can remove everything.</p><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:20px"><button class="btn primary" data-backup="1">Download JSON backup</button><button class="btn" id="restorebutton">Restore JSON backup</button></div><p class="hint">A restore replaces all existing records. Export a backup first.</p></section><section class="panel"><h2>Export your records</h2><p class="subtle">Download CSV files that can be opened in Excel.</p><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:15px">${['orders','products','customers','payments','invoices','deliveries','expenses'].map(k=>`<button class="btn" data-export="${k}">${k[0].toUpperCase()+k.slice(1)} CSV</button>`).join('')}</div></section><section class="panel"><h2>Demo & data controls</h2><p class="subtle">Use realistic sample data to explore the workspace.</p><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:15px"><button class="btn" id="resetdemo">Reset sample data</button><button class="btn danger" id="clearall">Clear all records</button></div><p class="hint">Deleting local data cannot be undone without a backup.</p></section></div><div class="notice">This is a single-device offline prototype. It does not include account login, live cloud sync, payment processing, verified mobile-money transactions, automatic WhatsApp sending or multi-user access. Those need a hosted backend and integrations.</div>`}

 const btn=$('newcustomer'), panel=$('inlinecustomer'), select=$('f_customerId');

function updateOrderTotal(){if(currentModal!=='order'||!$('liveordertotal'))return;let sum=[...document.querySelectorAll('#lines .lineitem')].reduce((s,r)=>s+Math.max(0,Number(r.querySelector('.li-qty').value)||0)*Math.max(0,Number(r.querySelector('.li-price').value)||0),0);let discount=Math.max(0,Number(formValue('discount'))||0),fee=Math.max(0,Number(formValue('deliveryFee'))||0);$('liveordertotal').textContent=MONEY(Math.max(0,sum-discount+fee))}

function bindItems(){$('lines').addEventListener('change',e=>{let sel=e.target.closest('.li-prod');if(!sel)return;let p=product(sel.value),row=sel.closest('.lineitem');row.querySelector('.custom-product-choice').classList.toggle('hidden',!!p);if(p){row.querySelector('.li-name').value=p.name;row.querySelector('.li-price').value=p.price;row.querySelector('.li-save-product').checked=false;}updateOrderTotal()});$('lines').addEventListener('click',e=>{if(!e.target.closest('.li-remove'))return;if($('lines').children.length<=1){toast('An order needs at least one item');return}e.target.closest('.lineitem').remove();updateOrderTotal()})}

function openPayment(id,presetOrderId){const p=db.payments.find(x=>x.id===id)||{date:now(),method:'Mobile money',amount:0,orderId:presetOrderId||''};const os=db.orders.filter(o=>o.status!=='Cancelled'||o.id===p.orderId);if(!os.length){toast('Create an order first');go('orders');return}modal(id?'Edit payment':'Record payment',`<div class="fields"><div class="field"><label for="f_orderId">Order</label><select id="f_orderId" required><option value="">Select order</option>${os.map(o=>`<option value="${E(o.id)}" ${p.orderId===o.id?'selected':''}>${E(o.id)} · ${E(customer(o.customerId).name)} · Due ${MONEY(balance(o)+(p.orderId===o.id?N(p.amount):0))}</option>`).join('')}</select></div>${fname('amount','Payment amount (UGX)','number',p.amount??'','required min="1" step="1"')}<div class="field full"><button type="button" class="btn" id="fillremaining">Use remaining balance</button></div>${customSelectF('method','Payment method',['Mobile money','Cash','Bank transfer','Card','Other'],p.method)}${fname('reference','Reference / transaction ID','text',p.reference||'')}${fname('date','Payment date','date',p.date||now(),'required')}${txtF('notes','Notes',p.notes||'')}</div><p class="notice" style="margin-top:15px">Only record payments you have independently verified. This form does not request or receive money.</p>`,'payment',id);$('fillremaining').onclick=()=>{let oid=formValue('orderId'),o=db.orders.find(o=>o.id===oid);if(!o)return toast('Choose an order first');$('f_amount').value=Math.max(0,balance(o)+(p.orderId===oid?N(p.amount):0));}}

function openStock(id){let p=product(id);if(!p)return;modal('Adjust stock · '+p.name,`<div class="fields">${fname('stock','Correct total units on hand','number',p.stock,'required min="0" step="1"')}${txtF('notes','Reason for adjustment (optional)','')}</div><p class="notice" style="margin-top:14px">Set the counted stock balance. This prototype does not keep a full adjustment audit trail.</p>`,'stock',id)}

function stockMap(o){let m=new Map();if(!o||o.status==='Cancelled')return m;(o.items||[]).forEach(i=>{if(i.productId)m.set(i.productId,(m.get(i.productId)||0)+N(i.qty))});return m}
function adjustStock(oldOrder,newOrder){let a=stockMap(oldOrder),b=stockMap(newOrder);for(let id of new Set([...a.keys(),...b.keys()])){let p=product(id);if(!p)return 'Product missing for stock adjustment';let next=N(p.stock)+(a.get(id)||0)-(b.get(id)||0);if(next<0)return `Not enough stock for ${p.name}. Available including old reservation: ${N(p.stock)+(a.get(id)||0)}`};for(let id of new Set([...a.keys(),...b.keys()])){let p=product(id);p.stock=N(p.stock)+(a.get(id)||0)-(b.get(id)||0)}return null}
function formValue(k){return $('f_'+k)?.value?.trim()||''}function numForm(k){return Number(formValue(k))}function validMoney(n){return Number.isFinite(n)&&n>=0&&Number.isInteger(n)}
function submit(e){e.preventDefault();let type=currentModal,id=editingId,entry,saveNotice='',previewKind='',previewId='';try{if(type==='customer'){entry={id:id||uid('c'),name:formValue('name'),phone:formValue('phone'),email:formValue('email'),address:formValue('address'),notes:formValue('notes')};if(!entry.name)throw Error('Customer name is required');upsert('customers',entry)}else if(type==='product'){entry={id:id||uid('p'),name:formValue('name'),sku:formValue('sku'),price:numForm('price'),cost:numForm('cost'),stock:numForm('stock'),low:numForm('low'),active:$('f_active').checked};if(!entry.name||![entry.price,entry.cost,entry.stock,entry.low].every(validMoney))throw Error('Check product details and use non-negative whole numbers');upsert('products',entry)}else if(type==='stock'){let p=product(id),n=numForm('stock');if(!validMoney(n))throw Error('Stock must be a non-negative whole number');p.stock=n}else if(type==='order'){let items=[...document.querySelectorAll('#lines .lineitem')].map(row=>({productId:row.querySelector('.li-prod').value,name:row.querySelector('.li-name').value.trim(),qty:Number(row.querySelector('.li-qty').value),price:Number(row.querySelector('.li-price').value)}));let productsToSave=[...document.querySelectorAll('#lines .lineitem')].filter(row=>!row.querySelector('.li-prod').value&&row.querySelector('.li-save-product').checked).map(row=>({name:row.querySelector('.li-name').value.trim(),price:Number(row.querySelector('.li-price').value)}));let creatingCustomer=!$('inlinecustomer').classList.contains('hidden');let newCustomer=null;let selectedCustomer=formValue('customerId');if(creatingCustomer){let name=formValue('newName'),phone=formValue('newPhone'),email=formValue('newEmail'),address=formValue('newAddress');if(!name)throw Error('Enter the new customer’s name');if(email && !$('f_newEmail').checkValidity())throw Error('Enter a valid customer email');let normalizedPhone=phone.replace(/\D/g,'');if(normalizedPhone.length>=7&&db.customers.some(c=>(c.phone||'').replace(/\D/g,'')===normalizedPhone))throw Error('This phone number already belongs to a customer. Choose them from the list instead.');newCustomer={id:uid('c'),name,phone,email,address,notes:''};selectedCustomer=newCustomer.id}if(!selectedCustomer||!items.length||items.some(i=>!i.name||!Number.isInteger(i.qty)||i.qty<1||!validMoney(i.price)))throw Error('Choose or add a customer and check each item, quantity and price');let disc=numForm('discount'),fee=numForm('deliveryFee');if(!validMoney(disc)||!validMoney(fee)||disc>items.reduce((a,i)=>a+i.qty*i.price,0))throw Error('Check discount and delivery charge');entry={id:id||uid('O'),customerId:selectedCustomer,items:items.map(i=>({...i,cost:N(product(i.productId)?.cost)})),discount:disc,deliveryFee:fee,status:formValue('status'),delivery:formValue('delivery'),address:formValue('address'),due:formValue('due'),channel:customValue('channel'),notes:formValue('notes'),date:formValue('date')};if(!newCustomer&&!db.customers.some(c=>c.id===entry.customerId))throw Error('Choose an existing customer or create a new one');if(entry.status==='Cancelled'&&paid(entry.id)>0)throw Error('Refund or remove linked payments before cancelling');if(total(entry)<paid(entry.id))throw Error('Order total cannot be less than existing payments');if(!entry.channel)throw Error('Enter the sales channel');if(activeInvoice(entry.id)){let prior=db.orders.find(o=>o.id===entry.id);let sig=o=>JSON.stringify([o.customerId,(o.items||[]).map(i=>[i.productId,i.name,N(i.qty),N(i.price)]),N(o.discount),N(o.deliveryFee)]);if(sig(prior)!==sig(entry)||entry.status==='Cancelled')throw Error('Void the issued invoice before changing this order’s customer, items, amounts or cancelling it')}let error=adjustStock(db.orders.find(o=>o.id===id),entry);if(error)throw Error(error);if(newCustomer)upsert('customers',newCustomer);upsert('orders',entry);saveCustomOption('channel');let savedProducts=0;for(let item of productsToSave){let existing=db.products.find(p=>p.name.trim().toLowerCase()===item.name.toLowerCase());if(existing)continue;upsert('products',{id:uid('p'),name:item.name,sku:'',price:item.price,cost:0,stock:0,low:0,active:true});savedProducts++}if(savedProducts)saveNotice=savedProducts+' custom product'+(savedProducts===1?'':'s')+' added to Products'}else if(type==='payment'){let previous=db.payments.find(p=>p.id===id);entry={id:id||uid('pay'),orderId:formValue('orderId'),amount:numForm('amount'),method:customValue('method'),reference:formValue('reference'),date:formValue('date'),notes:formValue('notes'),receiptNo:previous?.receiptNo||'',createdAt:previous?.createdAt||new Date().toISOString()};let o=db.orders.find(o=>o.id===entry.orderId);if(!o||o.status==='Cancelled')throw Error('Select a current order');if(!validMoney(entry.amount)||entry.amount<=0)throw Error('Enter a valid positive amount');let existing=db.payments.filter(p=>p.orderId===entry.orderId&&p.id!==id).reduce((a,p)=>a+N(p.amount),0);if(existing+entry.amount>total(o))throw Error('Payment exceeds outstanding order amount');if(!entry.method)throw Error('Enter a payment method');if(!entry.receiptNo)entry.receiptNo=documentNumber('receipt');upsert('payments',entry);saveCustomOption('method');previewKind='receipt';previewId=entry.id}else if(type==='invoice'){
 let o=db.orders.find(o=>o.id===formValue('orderId'));
 if(!o||o.status==='Cancelled'||activeInvoice(o.id))throw Error('Select an order that has not already been invoiced');
 let issuedDate=formValue('issueDate'),dueDate=formValue('dueDate');
 if(!issuedDate||dueDate&&dueDate<issuedDate)throw Error('The payment due date cannot be earlier than the issue date');
 entry={id:uid('inv'),number:documentNumber('invoice'),orderId:o.id,issuedDate,dueDate,notes:formValue('notes'),status:'Issued',snapshot:invoiceSnapshot(o)};
 db.invoices.unshift(entry);previewKind='invoice';previewId=entry.id;
}else if(type==='expense'){entry={id:id||uid('exp'),description:formValue('description'),category:customValue('category'),amount:numForm('amount'),date:formValue('date'),notes:formValue('notes')};if(!entry.description||!validMoney(entry.amount))throw Error('Check the expense details');if(!entry.category)throw Error('Enter an expense category');upsert('expenses',entry);saveCustomOption('category')}else if(type==='delivery'){let o=db.orders.find(o=>o.id===id);let newer={...o,delivery:formValue('delivery'),due:formValue('due'),address:formValue('address'),status:formValue('status')};if(newer.status==='Cancelled'&&activeInvoice(id))throw Error('Void the invoice before cancelling this order');if(newer.status==='Cancelled'&&paid(id)>0)throw Error('Resolve linked payments before cancelling');let error=adjustStock(o,newer);if(error)throw Error(error);upsert('orders',newer)}else return;persist();$('modal').close();render();toast(saveNotice||'Saved successfully');if(previewKind)openDocument(previewKind,previewId)}catch(err){toast(err.message||'Could not save')}}
function upsert(k,v){let idx=db[k].findIndex(x=>x.id===v.id);if(idx>=0)db[k][idx]=v;else db[k].unshift(v)}function remove(type,id){let maps={product:'products',customer:'customers',payment:'payments',expense:'expenses',order:'orders'},key=maps[type];if(!key)return;let item=db[key].find(x=>x.id===id);if(!item)return;if(type==='customer'&&db.orders.some(o=>o.customerId===id))return toast('Cannot delete a customer with orders');if(type==='product'&&db.orders.some(o=>(o.items||[]).some(i=>i.productId===id)))return toast('Product used in orders. Mark it inactive instead.');if(type==='order'&&db.invoices.some(i=>i.orderId===id))return toast('This order has invoice history and cannot be deleted.');if(type==='order'&&db.payments.some(p=>p.orderId===id))return toast('Delete or reconcile linked payments before deleting this order.');if(!confirm(`Delete this ${type}?`))return;if(type==='order'){let err=adjustStock(item,null);if(err)return toast(err)}db[key]=db[key].filter(x=>x.id!==id);persist();render();toast('Deleted')}
function normalizedPhone(input){let p=String(input||'').replace(/[^0-9]/g,'');if(p.startsWith('0'))p='256'+p.slice(1);if(p.length===9)p='256'+p;return p}function whatsapp(phone,msg){let p=normalizedPhone(phone);if(!p){if(navigator.clipboard)navigator.clipboard.writeText(msg).then(()=>toast('No phone number. Message copied.'),()=>prompt('Copy this message:',msg));else prompt('Copy this message:',msg);return}window.open('https://wa.me/'+p+'?text='+encodeURIComponent(msg),'_blank','noopener,noreferrer')}
function waOrder(id){let o=db.orders.find(o=>o.id===id);if(!o)return;let c=customer(o.customerId),msg=`Hello ${c.name}, here is an update from ${db.settings.business}.\nOrder: ${o.id}\n${o.items.map(i=>`${i.qty} × ${i.name}`).join('\n')}\nTotal: ${MONEY(total(o))}\nPaid: ${MONEY(paid(id))}\nBalance: ${MONEY(balance(o))}\nOrder status: ${o.status}\nDelivery: ${o.delivery}\nThank you!`;whatsapp(c.phone,msg)}

function paymentPosition(p){
 let payments=db.payments.filter(x=>x.orderId===p.orderId).slice().sort((a,b)=>a.date.localeCompare(b.date)||(a.createdAt||'').localeCompare(b.createdAt||'')||(db.payments.indexOf(b)-db.payments.indexOf(a)));
 let index=payments.findIndex(x=>x.id===p.id);
 let cumulative=payments.slice(0,index+1).reduce((sum,x)=>sum+N(x.amount),0);
 let o=db.orders.find(o=>o.id===p.orderId);
 let due=Math.max(0,total(o||{items:[]})-cumulative);
 return {cumulative,due,label:due===0?'Paid in full':'Partial payment'};
}
function docLine(label,value,strong=false){return `<div class="doc-total${strong?' strong':''}"><span>${E(label)}</span><span>${E(value)}</span></div>`}
function docHeader(kind,number,biz,loc,phone){
 return `<div class="doc-head"><div><h1>${E(biz)}</h1><div class="doc-muted">${E(loc||'')}${phone?' · '+E(phone):''}</div></div><div style="text-align:right"><h2>${E(kind)}</h2><strong>${E(number)}</strong></div></div>`;
}
function documentHtml(kind,id){
 if(kind==='receipt'){
  let p=db.payments.find(p=>p.id===id);if(!p)return '';
  let o=db.orders.find(o=>o.id===p.orderId);if(!o)return '';
  let c=customer(o.customerId),position=paymentPosition(p);
  return `<section class="doc-paper">${docHeader('PAYMENT RECEIPT',receiptNumber(p),db.settings.business,db.settings.location,db.settings.phone)}
  <p><strong>Received from:</strong> ${E(c.name)}<br><strong>Order:</strong> ${E(p.orderId)}<br><strong>Date:</strong> ${dateLabel(p.date)}<br><strong>Payment method:</strong> ${E(p.method)}${p.reference?'<br><strong>Reference:</strong> '+E(p.reference):''}</p>
  <hr>${docLine('Payment received',MONEY(p.amount),true)}${docLine('Order total',MONEY(total(o)))}${docLine('Paid including this payment',MONEY(position.cumulative))}${docLine('Balance after payment',MONEY(position.due),true)}
  <p><strong>${E(position.label)}</strong></p>${p.notes?'<p>Note: '+E(p.notes)+'</p>':''}
  <p class="doc-note">Issued from manually recorded payments. Verify mobile money or bank transfers independently. Not a bank confirmation or tax invoice.</p></section>`;
 }
 let i=db.invoices.find(i=>i.id===id);if(!i)return '';
 let d=i.snapshot,currency=d.currency||'UGX';
 return `<section class="doc-paper">${docHeader('INVOICE',i.number,d.business,d.location,d.phone)}
 <p><strong>Bill to:</strong> ${E(d.customerName)}${d.customerPhone?'<br>'+E(d.customerPhone):''}${d.customerAddress?'<br>'+E(d.customerAddress):''}<br><strong>Order:</strong> ${E(i.orderId)}<br><strong>Issued:</strong> ${dateLabel(i.issuedDate)}<br><strong>Due:</strong> ${dateLabel(i.dueDate)}</p>
 ${i.status==='Void'?'<h2 style="color:#a82929">VOID</h2>':''}
 <table><thead><tr><th>ITEM</th><th>QTY</th><th>UNIT PRICE</th><th>AMOUNT</th></tr></thead><tbody>${(d.items||[]).map(x=>`<tr><td>${E(x.name)}</td><td>${N(x.qty)}</td><td>${MONEY(x.price)}</td><td>${MONEY(N(x.qty)*N(x.price))}</td></tr>`).join('')}</tbody></table>
 ${docLine('Subtotal',MONEY(d.subtotal))}${docLine('Discount',MONEY(d.discount))}${docLine('Delivery',MONEY(d.deliveryFee))}${docLine('Invoice total',MONEY(d.total),true)}
 ${docLine('Payments recorded',MONEY(invoicePaid(i)))}${docLine('Balance due',MONEY(invoiceBalance(i)),true)}
 <p><strong>Status:</strong> ${E(invoiceStatus(i))}</p>${i.notes?'<p>'+E(i.notes)+'</p>':''}
 <p class="doc-note">Generated from business records. Payment entries are manual and are not proof of a bank or mobile-money transfer. Tax treatment has not been verified.</p></section>`;
}
function openDocument(kind,id){
 if(!documentHtml(kind,id)){toast('Document not found');return}
 modal(kind==='receipt'?'E-receipt':'Invoice',`<div class="doc-preview">${documentHtml(kind,id)}</div>`,'document',id);
 $('modalsave').hidden=true;$('modalcancel').textContent='Close';
 $('modalform').querySelector('.modalfoot').insertAdjacentHTML('afterbegin',`<button type="button" class="btn primary" data-doc-control data-print-kind="${kind}" data-print-id="${E(id)}">Print / Save PDF</button><button type="button" class="btn" data-doc-control data-share-kind="${kind}" data-share-id="${E(id)}">WhatsApp</button>`);
}
function printDocument(kind,id){let markup=documentHtml(kind,id);if(!markup)return toast('Document not found');$('printarea').innerHTML=markup;window.print()}
function shareDocument(kind,id){
 if(kind==='receipt'){
  let p=db.payments.find(p=>p.id===id);if(!p)return;
  let o=db.orders.find(o=>o.id===p.orderId);if(!o)return;
  let c=customer(o.customerId),x=paymentPosition(p);
  whatsapp(c.phone,`Hello ${c.name}, payment receipt ${receiptNumber(p)} from ${db.settings.business}.\nOrder: ${p.orderId}\nReceived: ${MONEY(p.amount)}\nMethod: ${p.method}\nDate: ${dateLabel(p.date)}\nTotal paid: ${MONEY(x.cumulative)}\nBalance: ${MONEY(x.due)}\n${x.label}`);
 }else{
  let i=db.invoices.find(i=>i.id===id);if(!i)return;
  let c=db.customers.find(c=>c.id===db.orders.find(o=>o.id===i.orderId)?.customerId)||{};
  whatsapp(i.snapshot.customerPhone||c.phone,`Hello ${i.snapshot.customerName}, here is invoice ${i.number} from ${i.snapshot.business}.\nOrder: ${i.orderId}\nAmount: ${MONEY(i.snapshot.total)}\nPaid: ${MONEY(invoicePaid(i))}\nBalance: ${MONEY(invoiceBalance(i))}\nDue: ${dateLabel(i.dueDate)}\nStatus: ${invoiceStatus(i)}`);
 }
}
function voidInvoice(id){
 let i=db.invoices.find(i=>i.id===id);if(!i||i.status==='Void')return;
 if(invoicePaid(i)>0)return toast('Reconcile existing payments before voiding this invoice.');
 if(!confirm('Void invoice '+i.number+'? Its number and record will be retained.'))return;
 i.status='Void';i.voidedAt=new Date().toISOString();persist();render();toast('Invoice voided');
}
function orderActions(id){
 modal('Order '+id,`<div class="doc-actions"><button type="button" class="btn" data-order-control data-action="wa" data-order-id="${E(id)}">WhatsApp update</button><button type="button" class="btn" data-order-control data-action="statement" data-order-id="${E(id)}">Order statement</button><button type="button" class="btn" data-order-control data-action="delivery" data-order-id="${E(id)}">Delivery</button><button type="button" class="btn danger" data-order-control data-action="delete" data-order-id="${E(id)}">Delete</button></div>`,'actions',id);
 $('modalsave').hidden=true;$('modalcancel').textContent='Close';
}

function printStatement(id){let o=db.orders.find(o=>o.id===id);if(!o)return;let c=customer(o.customerId);$('printarea').innerHTML=`<h1>${E(db.settings.business)}</h1><p>${E(db.settings.location)} · ${E(db.settings.phone)}</p><hr><h2>Order statement</h2><p>Order: ${E(o.id)} · Date: ${dateLabel(o.date)}<br>Customer: ${E(c.name)} · ${E(c.phone)}<br>Status: ${E(o.status)}</p><table><thead><tr><th>ITEM</th><th>QTY</th><th>UNIT PRICE</th><th>TOTAL</th></tr></thead><tbody>${o.items.map(i=>`<tr><td>${E(i.name)}</td><td>${N(i.qty)}</td><td>${MONEY(i.price)}</td><td>${MONEY(N(i.price)*N(i.qty))}</td></tr>`).join('')}</tbody></table><p>Subtotal: ${MONEY(subtotal(o))}<br>Discount: ${MONEY(o.discount)}<br>Delivery: ${MONEY(o.deliveryFee)}<br><strong>Order total: ${MONEY(total(o))}</strong><br>Paid (manually recorded): ${MONEY(paid(id))}<br><strong>Balance: ${MONEY(balance(o))}</strong></p><p>Delivery: ${E(o.address||'Not provided')}</p><p style="margin-top:30px;font-size:10px">This document reflects manually entered records and does not confirm a payment was received by a financial institution.</p>`;window.print()}
const cols={orders:['id','date','customer','phone','items','subtotal','discount','deliveryFee','total','paid','balance','status','delivery','address','due','channel','notes'],products:['id','name','sku','price','cost','stock','low','active'],customers:['id','name','phone','email','address','notes'],payments:['id','date','orderId','customer','amount','method','reference','receiptNo','notes'],invoices:['number','orderId','customer','issuedDate','dueDate','total','paid','balance','status'],deliveries:['id','customer','phone','address','due','status','delivery'],expenses:['id','date','description','category','amount','notes']};function exportRows(kind){if(kind==='orders')return db.orders.map(o=>({...o,customer:customer(o.customerId).name,phone:customer(o.customerId).phone,items:o.items.map(i=>`${i.qty}x ${i.name}`).join('; '),subtotal:subtotal(o),total:total(o),paid:paid(o.id),balance:balance(o)}));if(kind==='deliveries')return db.orders.filter(o=>o.status!=='Cancelled').map(o=>({...o,customer:customer(o.customerId).name,phone:customer(o.customerId).phone}));if(kind==='payments')return db.payments.map(p=>({...p,receiptNo:receiptNumber(p),customer:customer(db.orders.find(o=>o.id===p.orderId)?.customerId).name}));if(kind==='invoices')return db.invoices.map(i=>({...i,customer:i.snapshot.customerName,total:i.snapshot.total,paid:invoicePaid(i),balance:invoiceBalance(i),status:invoiceStatus(i)}));return db[kind]||[]}
function download(name,text,type){let blob=new Blob([text],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function exportCSV(kind){let fields=cols[kind],rows=exportRows(kind);if(!fields)return;let quote=x=>'"'+String(x??'').replace(/^[=+@\-\t\r]/,m=>"'"+m).replace(/"/g,'""')+'"';download(`greylad-${kind}-${now()}.csv`,'\ufeff'+[fields.map(quote).join(','),...rows.map(r=>fields.map(f=>quote(r[f])).join(','))].join('\r\n'),'text/csv;charset=utf-8');toast('CSV exported')}
function backup(){download('greylad-orders-backup-'+now()+'.json',JSON.stringify({...db,backupVersion:3,exportedAt:new Date().toISOString()},null,2),'application/json');toast('Backup downloaded')}
$('nav').onclick=e=>{let b=e.target.closest('[data-tab]');if(b)go(b.dataset.tab)};$('quickorder').onclick=()=>openOrder();$('quickbackup').onclick=backup;$('modalclose').onclick=$('modalcancel').onclick=()=>$('modal').close();$('modalbody').addEventListener('change',e=>{let sel=e.target.closest('[data-custom-select]');if(!sel)return;let f=sel.dataset.customSelect;let el=$('custom_'+f);if(el)el.classList.toggle('hidden',sel.value!=='__custom__')});$('modalform').onsubmit=submit;
$('content').addEventListener('input',e=>{if(e.target.id==='searchlist'){let pos=e.target.selectionStart;q=e.target.value.toLowerCase();render();let n=$('searchlist');if(n){n.focus();n.setSelectionRange(pos,pos)}}});$('content').addEventListener('change',e=>{if(e.target.id==='statusfilter'){orderFilter=e.target.value;render()}});
$('content').addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let d=b.dataset;if(d.go)return go(d.go);if(d.add){({order:openOrder,customer:openCustomer,product:openProduct,payment:openPayment,invoice:openInvoice,expense:openExpense}[d.add]||(()=>{}))();return}if(d.edit){({order:openOrder,customer:openCustomer,product:openProduct,payment:openPayment,expense:openExpense}[d.edit]||(()=>{}))(d.id);return}if(d.stock)return openStock(d.stock);if(d.delivery)return openDelivery(d.delivery);if(d.delete)return remove(d.delete,d.id);if(d.export)return exportCSV(d.export);if(d.backup)return backup();if(d.wa)return waOrder(d.wa);if(d.waCustomer){let c=customer(d.waCustomer);return whatsapp(c.phone,`Hello ${c.name}, greetings from ${db.settings.business}!`)}if(d.invoiceOrder){let i=activeInvoice(d.invoiceOrder);return i?openDocument('invoice',i.id):openInvoice(d.invoiceOrder)}if(d.payOrder)return openPayment(null,d.payOrder);if(d.receipt)return openDocument('receipt',d.receipt);if(d.invoiceView)return openDocument('invoice',d.invoiceView);if(d.invoiceShare)return shareDocument('invoice',d.invoiceShare);if(d.invoiceVoid)return voidInvoice(d.invoiceVoid);if(d.more)return orderActions(d.more);if(b.id==='saveprofile'){let s=db.settings;s.business=$('f_bizname').value.trim()||'My Business';s.phone=$('f_bizphone').value.trim();s.location=$('f_bizlocation').value.trim();persist();render();toast('Profile saved')}if(b.id==='restorebutton')$('importfile').click();if(b.id==='resetdemo'){if(confirm('Replace all current records with demo data? Download a backup first.')){db=seed();persist();render();toast('Demo restored')}}if(b.id==='clearall'){if(confirm('Delete all records on this browser? This cannot be undone without a backup.')){db={...seed(),orders:[],products:[],customers:[],payments:[],invoices:[],expenses:[],demo:false};persist();render();toast('Records cleared')}}});
$('importfile').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{if(file.size>10*1024*1024)throw Error('Backup exceeds 10 MB');let data=normalize(JSON.parse(await file.text()));if(!confirm('Replace ALL current records with this backup? Consider downloading your current backup first.'))return;db=data;persist();render();toast('Backup restored')}catch(err){toast('Restore failed: '+(err.message||'Invalid file'))}finally{e.target.value=''}};
$('modal').addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let d=b.dataset;if(d.printKind)return printDocument(d.printKind,d.printId);if(d.shareKind)return shareDocument(d.shareKind,d.shareId);if(d.orderControl!==undefined){$('modal').close();switch(d.action){case 'wa':return waOrder(d.orderId);case 'statement':return printStatement(d.orderId);case 'delivery':return openDelivery(d.orderId);case 'delete':return remove('order',d.orderId)}}});
render();
</script></body></html>
