<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Greylad Pharmacy workspace"><title>Greylad Pharmacy</title><link rel="stylesheet" href="/login.css"><script src="/config.js" defer></script><script src="/login.js" defer></script></head><body><main id="login"><div class="brand">GREYLAD<span>PHARMACY</span></div><section class="panel"><p class="eyebrow">YOUR PHARMACY WORKSPACE</p><h1>Welcome back.</h1><p class="intro">Sign in with your approved account.</p><form id="login-form"><label>Pharmacy name or code<input name="pharmacy" autocomplete="organization" required maxlength="80" placeholder="Your registered pharmacy"></label><label>Username<input name="username" autocomplete="username" required maxlength="40"></label><label>Password<input name="password" type="password" autocomplete="current-password" required maxlength="1000"></label><p id="login-error" role="status" aria-live="polite"></p><button id="sign-in">Sign in</button></form><p class="help">Need access or help signing in? Contact your pharmacy administrator.</p></section><footer>Greylad · Pharmacy management</footer></main><iframe id="workspace" title="Pharmacy workspace" hidden></iframe></body></html>
