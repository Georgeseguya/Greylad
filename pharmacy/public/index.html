<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Greylad Pharmacy workspace"><title>Greylad Pharmacy</title><link rel="stylesheet" href="/login.css"><script src="/config.js" defer></script><script src="/login.js" defer></script><style>#owner-registration{border-top:1px solid #d5d7db;margin-top:20px;padding-top:13px}#owner-registration summary{cursor:pointer;font-weight:600;padding:8px 0}#owner-form{display:grid;gap:12px;padding:14px 0}#owner-error{font-size:12px;color:#9a3340;min-height:0}#owner-form button{width:100%}</style></head><body><main id="login"><div class="brand">GREYLAD<span>PHARMACY</span></div><section class="panel"><p class="eyebrow">YOUR PHARMACY WORKSPACE</p><h1>Welcome back.</h1><p class="intro">Sign in with your approved account.</p><form id="login-form"><label>Pharmacy name or code<input name="pharmacy" autocomplete="organization" required maxlength="80" placeholder="Your registered pharmacy"></label><label>Username<input name="username" autocomplete="username" required maxlength="40"></label><label>Password<input name="password" type="password" autocomplete="current-password" required maxlength="1000"></label><p id="login-error" role="status" aria-live="polite"></p><button id="sign-in">Sign in</button></form><details id="owner-registration"><summary>Create owner account</summary><form id="owner-form"><label>Username<input name="username" autocomplete="username" required maxlength="40" placeholder="Your approved username"></label><label>Email<input type="email" name="email" autocomplete="email" required></label><label>Create password<input type="password" name="password" minlength="10" required autocomplete="new-password"></label><label>Confirm password<input type="password" name="confirmPassword" minlength="10" required autocomplete="new-password"></label><p id="owner-error" role="status" aria-live="polite"></p><button id="create-owner">Create account</button></form><p class="help">Only approved pharmacy owners can register. Verify your email before signing in.</p></details><p class="help">Need access or help signing in? Contact your pharmacy administrator.</p></section><footer>Greylad · Pharmacy management</footer></main><iframe id="workspace" title="Pharmacy workspace" hidden></iframe></body></html>
