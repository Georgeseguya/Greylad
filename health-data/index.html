function F(key){let arr=data[key]||[];if(state.facility!=='All facilities'){arr=arr.filter(r=>key==='facilities'?r.name===state.facility:r.facility===state.facility)}let s=state.search.trim().toLowerCase();if(s)arr=arr.filter(r=>Object.values(r).some(v=>String(v).toLowerCase().includes(s)));return arr.slice()}
function filtered(key){let arr=data[key]||[];return state.facility==='All facilities'?arr:arr.filter(r=>key==='facilities'?r.name===state.facility:r.facility===state.facility)}
function agg(records,field,value){let map={};records.forEach(x=>{const k=String(x[field]||'Other');map[k]=(map[k]||0)+(value?(Number(x[value])||0):1)});return Object.entries(map).sort((a,b)=>b[1]-a[1])}
function topbars(arr,limit){let rows=arr.slice(0,limit||6),maximum=Math.max(1,...rows.map(x=>x[1]));return rows.length?'<div class="barlist">'+rows.map((x,i)=>'<div class="barrow"><span title="'+esc(x[0])+'">'+esc(x[0])+'</span><div class="bartrack"><div class="barfill '+(i>2?'light':'')+'" style="width:'+(x[1]/maximum*100).toFixed(1)+'%"></div></div><strong>'+n(x[1])+'</strong></div>').join('')+'</div>':'<div class="empty">No records to chart</div>'}
function metric(label,value,detail,icon){let display=typeof value==='string'&&value.endsWith('%')?esc(value):n(value);return '<div class="card metric"><div class="splithead"><span class="eyebrow">'+label+'</span><span class="iconbox">'+icon+'</span></div><div class="value">'+display+'</div><div class="detail">'+detail+'</div></div>'}
function head(title,desc,buttons){return '<div class="sectionhead"><div><h1>'+title+'</h1><p class="subline">'+desc+'</p></div><div class="actions">'+(buttons||'')+'</div></div>'}
function card(title,desc,body){return '<section class="card"><div class="card-head"><div><h2>'+title+'</h2>'+(desc?'<p>'+desc+'</p>':'')+'</div></div>'+body+'</section>'}
function btn(label,action,primary){return '<button class="btn '+(primary?'primary':'')+'" onclick="'+action+'">'+label+'</button>'}
function tag(s){let c= /^(Serious|Follow-up required|Critical)$/i.test(s)?'red':/under review|risk/i.test(s)?'amber':/reviewed|completed/i.test(s)?'green':'';return '<span class="tag '+c+'">'+esc(s)+'</span>'}
function table(key,rows,limit){let schema=SCHEMA[key];if(!schema)return '';let displayed=(limit?rows.slice(0,limit):rows).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));return '<div class="tablewrap"><table class="table"><thead><tr>'+schema.columns.map(c=>'<th>'+c[1]+'</th>').join('')+'<th></th></tr></thead><tbody>'+(!displayed.length?'<tr><td colspan="'+(schema.columns.length+1)+'"><div class="empty">No matching records</div></td></tr>':displayed.map(r=>'<tr>'+schema.columns.map((c,i)=>{let v=r[c[0]];if(c[0]==='quantity'||c[0]==='cases'||c[0]==='count'||c[0]==='stock'||c[0]==='monthly'||c[0]==='unmet')v=n(v);if(c[0]==='seriousness'||c[0]==='status')v=tag(String(v));else v=esc(v);return '<td class="'+(i===0?'strong':'')+'">'+v+'</td>'}).join('')+'<td><button class="tinybtn" title="Delete this demo record" aria-label="Delete record" onclick="del(\''+key+'\',\''+esc(r.id)+'\')">✕</button></td></tr>').join(''))+'</tbody></table></div>'}
function nav(){document.getElementById('nav').innerHTML='<div class="nav-label">WORKSPACE</div>'+NAV.slice(0,7).map(item=>navitem(item)).join('')+'<div class="nav-label">REPORTING</div>'+NAV.slice(7).map(item=>navitem(item)).join('')}
function navitem(item){return '<button class="'+(state.page===item[0]?'active':'')+'" onclick="go(\''+item[0]+'\')"><span style="width:18px;font-size:17px;text-align:center">'+item[2]+'</span>'+item[1]+'</button>'}
function go(p){state.page=p;state.search='';document.getElementById('search').value='';document.getElementById('aside').classList.remove('open');render()}
function toggleMenu(){document.getElementById('aside').classList.toggle('open')}
function dropdown(){return '<select class="select" aria-label="Facility filter" onchange="state.facility=this.value;render()"><option>All facilities</option>'+data.facilities.map(x=>'<option '+(state.facility===x.name?'selected':'')+'>'+esc(x.name)+'</option>').join('')+'</select>'}
function commonAction(key){return dropdown()+btn('+ Add record','openModal(\''+key+'\')',true)}
function overview(){
 const use=filtered('usage'),pv=filtered('safety'),d=filtered('diseases'),s=filtered('supply'),c=filtered('care');
 const serious=pv.filter(x=>x.seriousness==='Serious').length;
 return head('Overview','Health activity and medicine intelligence · demonstration data',dropdown()+btn('Export summary','exportCSV(\'usage\')'))+
 '<div class="notice"><strong>Demonstration only.</strong> Every facility and clinical record is fictional. These figures are not Uganda health statistics and cannot be used to make clinical decisions.</div>'+
 '<div class="grid g4">'+metric('Medicine units recorded',sum(use,'quantity'),'Units across submitted records','▦')+metric('Disease cases',sum(d,'cases'),'Reported condition counts','⌁')+metric('Suspected ADR reports',pv.length,serious+' marked serious · unverified','♡')+metric('Stockout watch',s.filter(danger).length,'Items with estimated cover under 14 days','▤')+'</div>'+
 '<div class="grid g2 sectiongap">'+card('Most used medicines','Units dispensed',topbars(agg(use,'medicine','quantity'),6))+card('Conditions reported','Case counts, not incidence rates',topbars(agg(d,'condition','cases'),6))+'</div>'+
 '<div class="grid g2 sectiongap">'+card('Safety reports','Suspected events awaiting assessment',table('safety',pv,3))+card('Supply watch','Estimated stock coverage',stockRows(s.slice().sort((a,b)=>days(a)-days(b)).slice(0,5)))+'</div>'+
 '<div class="grid g3 sectiongap">'+metric('Services recorded',sum(c,'count'),'Care and surgery activity','✚')+metric('Unfulfilled demand',sum(s,'unmet'),'Requests not fulfilled','◴')+metric('Facilities in dataset',state.facility==='All facilities'?data.facilities.length:1,'Fictional demonstration facilities','⌂')+'</div>';
}
function stockRows(rows){return '<div class="tablewrap"><table class="table"><thead><tr><th>Medicine</th><th>Facility</th><th>Days cover</th><th>Status</th></tr></thead><tbody>'+rows.map(x=>'<tr><td class="strong">'+esc(x.medicine)+'</td><td>'+esc(x.facility)+'</td><td>'+Math.round(days(x))+'</td><td>'+tag(danger(x)?'Risk':'Adequate')+'</td></tr>').join('')+'</tbody></table></div><div class="card-foot">Coverage = stock ÷ (recorded monthly units ÷ 30). Illustrative only.</div>'}
function records(key){let rows=F(key),title=SCHEMA[key].title;
 const extra=key==='usage'?card('Medicine distribution','Units by medicine',topbars(agg(filtered(key),'medicine','quantity'),7)):key==='diseases'?card('Most reported conditions','Counts by condition',topbars(agg(filtered(key),'condition','cases'),7)):key==='safety'?'<div class="notice"><strong>Safety reporting:</strong> These are suspected adverse events, not confirmed adverse drug reactions or validated safety signals. The prototype stores demo reports only. For actual reporting, use the regulator\'s authorised channels: <a href="https://www.nda.or.ug/adrs-aefis-reporting/" target="_blank" rel="noopener">NDA reporting page</a>.</div>':key==='supply'?'<div class="notice"><strong>Stock alerts:</strong> Coverage estimates rely on reported average monthly use and do not account for seasonality, pending deliveries or clinical changes.</div>':'';
 let stats='';
 if(key==='safety')stats='<div class="grid g3 sectiongap">'+metric('Reported events',filtered(key).length,'All seriousness classifications','♡')+metric('Serious suspected events',filtered(key).filter(r=>r.seriousness==='Serious').length,'Requires appropriate review','!')+metric('Follow-up required',filtered(key).filter(r=>r.status==='Follow-up required').length,'Pending follow-up','↗')+'</div>';
 if(key==='supply')stats='<div class="grid g3 sectiongap">'+metric('Stockout watch',filtered(key).filter(danger).length,'Estimated coverage < 14 days','!')+metric('Unmet requests',sum(filtered(key),'unmet'),'Recorded supply gaps','◴')+metric('Items monitored',filtered(key).length,'Stock reports','▤')+'</div>';
 if(key==='diseases')stats='<div class="grid g3 sectiongap">'+metric('Cases recorded',sum(filtered(key),'cases'),'Aggregate counts','⌁')+metric('Conditions',new Set(filtered(key).map(r=>r.condition)).size,'Distinct conditions','◫')+metric('Facilities reporting',new Set(filtered(key).map(r=>r.facility)).size,'Included in data','⌂')+'</div>';
 if(key==='care')stats='<div class="grid g3 sectiongap">'+metric('Services',sum(filtered(key),'count'),'Reported clinical activity','✚')+metric('Surgeries',sum(filtered(key).filter(r=>r.service==='Surgery'),'count'),'Reported procedures','◇')+metric('Facility reports',filtered(key).length,'Summary records','◫')+'</div>';
 return head(title,key==='safety'?'Record suspected events and review status':key==='supply'?'Stock coverage and unmet medicine demand':key==='diseases'?'Reported conditions and outcomes':key==='care'?'Facility services, procedures and outcomes':'Dispensing patterns and indications',commonAction(key))+
 extra+stats+'<div class="sectiongap">'+card('Recorded data',rows.length+' matching records',table(key,rows))+'</div>';
}
function facilities(){return head('Facilities','Reporting facilities in this demonstration',commonAction('facilities'))+
 '<div class="grid g3">'+metric('Facilities',data.facilities.length,'Fictional entities','⌂')+metric('Districts',new Set(data.facilities.map(r=>r.district)).size,'Covered in demo','◫')+metric('Submitting activity',new Set(data.usage.map(r=>r.facility)).size,'Medicine-use records','▦')+'</div>'+
 '<div class="sectiongap">'+card('Facility directory','Sample reporting locations',table('facilities',F('facilities')))+'</div>'}
function insights(){let us=filtered('usage'),d=filtered('diseases'),pv=filtered('safety'),care=filtered('care'),s=filtered('supply');
 let monthly={};us.forEach(r=>{let k=r.date.slice(0,7);monthly[k]=(monthly[k]||0)+Number(r.quantity)});
 return head('Analytics','Explore the reported patterns',dropdown()+btn('Export medicine use','exportCSV(\'usage\')'))+
 '<div class="grid g3">'+metric('Total units',sum(us,'quantity'),'Medicine-use observations','▦')+metric('Care activity',sum(care,'count'),'Recorded services','✚')+metric('Safety reports',pv.length,'Suspected events','♡')+'</div>'+
 '<div class="grid g2 sectiongap">'+card('Monthly medicine use','Reported units by month',topbars(Object.entries(monthly).sort((a,b)=>a[0].localeCompare(b[0]))))+card('Indications for medicines','Units associated with reported indications',topbars(agg(us,'condition','quantity'),7))+'</div>'+
 '<div class="grid g2 sectiongap">'+card('Clinical service mix','Reported activity',topbars(agg(care,'service','count'),7))+card('Demand gaps','Unfulfilled requests by medicine',topbars(agg(s,'medicine','unmet'),7))+'</div>'+
 '<div class="sectiongap">'+card('Disease observations','Recorded case counts, no population denominators',topbars(agg(d,'condition','cases'),8))+'</div>'+
 '<div class="card-foot">These descriptive charts do not establish drug effectiveness, safety causality, outbreak detection, or disease incidence. Forecasting will require longer validated datasets.</div>'}
function quality(){
 const all=['usage','safety','diseases','care','supply'].flatMap(k=>data[k].map(r=>({k,...r})));
 const total=all.length;let missing=0,required=0;all.forEach(r=>SCHEMA[r.k].fields.filter(f=>!f[3]).forEach(f=>{required++;if(r[f[0]]===undefined||r[f[0]]==='')missing++}));
 let pct=required?Math.round(100*(required-missing)/required):100,dups=0;let keys=new Set();
 all.forEach(r=>{let sig=[r.k,r.date,r.facility,r.medicine||r.condition||r.service,r.quantity||r.cases||r.count||r.stock].join('~');if(keys.has(sig))dups++;keys.add(sig)});
 return head('Data quality','Completeness and review checks',btn('Export backup','exportJSON()'))+
 '<div class="grid g3">'+metric('Field completeness',pct+'%','Required demo fields','◈')+metric('Missing fields',missing,'Across core datasets','?')+metric('Possible duplicates',dups,'Simple matching check','▢')+'</div>'+
 '<div class="grid g2 sectiongap">'+card('Required-field completeness','Across all demo records','<div class="progress"><div style="width:'+pct+'%"></div></div><div class="progress-label"><span>Completed fields</span><strong>'+pct+'%</strong></div><p class="card-foot">A complete field does not prove its accuracy.</p>')+
 card('Review checklist','Controls needed for real facility reporting',[
 ['Facility verification','Confirmed identity and reporting permissions'],
 ['Clinical vocabulary','Standard medicine, diagnosis and procedure codes'],
 ['Validation and duplicates','Ranges, missingness, timeliness and reconciliation'],
 ['Privacy and security','Institutional permissions, access controls and audit trail'],
 ['Regulatory reporting','Approved pharmacovigilance workflow and escalation']
 ].map((x,i)=>'<div class="listrow"><span class="number">'+(i+1)+'</span><div><h3>'+x[0]+'</h3><p>'+x[1]+'</p></div></div>').join(''))+'</div>'+
 '<div class="sectiongap">'+card('Dataset coverage','Fictional records available for testing','<div class="guidegrid">'+Object.keys(SCHEMA).filter(k=>k!=='facilities').map(k=>'<div class="guide"><h3>'+SCHEMA[k].title+'</h3><div class="mini-stat">'+n(data[k].length)+'</div><p>Sample records</p></div>').join('')+'</div>')+'</div>'}
function strategy(){return head('National data strategy','Uganda · 2026/27–2030/31',btn('Read strategy','window.open(\'https://ict.go.ug/media/news/uganda-launches-national-data-strategy\',\'_blank\',\'noopener\')'))+
 '<div class="notice"><strong>Independent Greylad concept.</strong> This platform is not operated, endorsed or connected to the Government of Uganda, Ministry of Health or the National Drug Authority.</div>'+
 '<div class="grid g2">'+card('National data ambition','Government target, not a platform performance figure','<div class="strategyline"><b><small>Reported baseline</small>36%</b><span class="arrow">→</span><b><small>Five-year target</small>80%</b></div><div class="progress"><div style="width:36%"></div></div><p class="card-foot">Share of NDP IV indicators supported by data. Source: Ministry of ICT and National Guidance, 2026.</p>')+
 card('Proposed health data contribution','Potential future reporting areas','<div class="guidegrid">'+[['01','Medicine utilisation'],['02','Suspected safety events'],['03','Disease trends'],['04','Clinical services'],['05','Supply gaps'],['06','Facility reporting']].map(x=>'<div class="guide"><span class="eyebrow">'+x[0]+'</span><h3 style="margin-top:8px">'+x[1]+'</h3></div>').join('')+'</div>')+'</div>'+
 '<div class="grid g2 sectiongap">'+card('How it could work','From facilities to useful indicators',[['Collect','Structured, validated facility-level summaries'],['Review','Check completeness, duplicates and reporting status'],['Aggregate','Combine eligible data without exposing patients'],['Use','Support planning, safety reviews and forecasting research']].map((x,i)=>'<div class="listrow"><span class="number">'+(i+1)+'</span><div><h3>'+x[0]+'</h3><p>'+x[1]+'</p></div></div>').join(''))+
 card('Before connecting real facilities','Requirements for a real deployment',[['Privacy','Uganda Data Protection and Privacy Act and health-data guidelines'],['Governance','Facility agreements and legal data processing basis'],['Interoperability','Harmonised standards and authorised national integration'],['Pharmacovigilance','Route formal ADR reports through authorised NDA channels'],['Security','Verified authentication, least-privilege access, audit logs and encryption']].map((x,i)=>'<div class="listrow"><span class="number">'+(i+1)+'</span><div><h3>'+x[0]+'</h3><p>'+x[1]+'</p></div></div>').join(''))+'</div>'}
function settings(){return head('Settings','Local demonstration workspace','')+
 '<div class="grid g2">'+card('Demo data','Records are stored only in this browser. No login, patient database or server syncing is enabled.','<div class="actions">'+btn('Download JSON backup','exportJSON()',true)+btn('Reset demo data','resetDemo()')+'</div><p class="card-foot">Do not enter actual patient information into this prototype.</p>')+
 card('Export data','Download CSV files for inspection','<div class="actions">'+['usage','safety','diseases','care','supply','facilities'].map(k=>btn(SCHEMA[k].title,'exportCSV(\''+k+'\')')).join('')+'</div>')+'</div>'+
 '<div class="sectiongap">'+card('System information','Greylad design system','<div class="listrow"><span class="number">g</span><div><h3>Uganda Health Data Platform</h3><p>Prototype v1 · Space Grotesk · Greylad graphite</p></div></div><div class="listrow"><span class="number">◈</span><div><h3>Scope</h3><p>Medicine use, suspected ADRs, disease summaries, clinical services, shortages, analytics and strategy alignment</p></div></div><div class="listrow"><span class="number">⌂</span><div><h3>Deployment model</h3><p>Standalone client-side prototype; no regulated clinical data collection enabled</p></div></div>')+'</div>'}
function render(){nav();document.getElementById('crumb').textContent=(NAV.find(x=>x[0]===state.page)||NAV[0])[1];let html;switch(state.page){case'overview':html=overview();break;case'facilities':html=facilities();break;case'insights':html=insights();break;case'quality':html=quality();break;case'strategy':html=strategy();break;case'settings':html=settings();break;default:html=records(state.page)}
 document.getElementById('content').innerHTML=html+'<div class="footerline">© 2026 Greylad · Uganda Health Data Platform · Fictional demonstration data</div>'}
function openModal(key){state.modal=key;const schema=SCHEMA[key];document.getElementById('modaltitle').textContent='Add '+schema.singular.toLowerCase();let fields=schema.fields.map(f=>{let [key,label,type]=f;let options=type==='facility'?data.facilities.map(x=>x.name):opts[type];let optional=!!f[3],req=optional?'':'required';let inner=options?'<select name="'+key+'" '+req+'>'+(optional?'<option value="">Not recorded</option>':'')+options.map(o=>'<option value="'+esc(o)+'">'+esc(o)+'</option>').join('')+'</select>':type==='textarea'?'<textarea name="'+key+'" maxlength="1000" '+req+'></textarea>':'<input name="'+key+'" type="'+(type==='number'?'number':type==='date'?'date':'text')+'" '+(type==='number'?'min="0" step="1"':'')+' '+(type==='date'?'max="2100-12-31" '+(optional?'':'value="'+TODAY+'"'):'')+' '+req+' maxlength="180">';return '<div class="field"><label for="f_'+key+'">'+label+'</label>'+inner.replace('name="'+key+'"','id="f_'+key+'" name="'+key+'"')+'</div>'}).join('');document.getElementById('formfields').innerHTML=fields;document.getElementById('modalback').classList.add('open');document.querySelector('#entryForm input,#entryForm select')?.focus()}
function closeModal(){state.modal=null;document.getElementById('modalback').classList.remove('open')}
function submitEntry(e){e.preventDefault();let key=state.modal;if(!key)return;let values=Object.fromEntries(new FormData(e.target).entries());if(SCHEMA[key].fields.some(f=>!f[3]&&!String(values[f[0]]||'').trim()))return notify('Complete the required fields');for(let k of ['quantity','cases','count','stock','monthly','unmet'])if(k in values){values[k]=Number(values[k]);if(!Number.isSafeInteger(values[k])||values[k]<0)return notify('Enter a valid non-negative whole number')}
 if(key==='facilities'){if(data.facilities.some(f=>f.name.toLowerCase()===values.name.trim().toLowerCase()))return notify('Facility already exists');values.name=values.name.trim();FAC.push(values.name)}
 values.id=key[0].toUpperCase()+Date.now().toString(36);data[key].unshift(values);save();closeModal();render();notify('Demo record saved')}
function del(key,id){if(key==='facilities'){let item=data.facilities.find(x=>x.id===id);if(item&&['usage','safety','diseases','care','supply'].some(k=>data[k].some(r=>r.facility===item.name)))return notify('This facility has linked records. Delete those first.')}if(!confirm('Delete this fictional record?'))return;data[key]=data[key].filter(r=>r.id!==id);if(key==='facilities'&&state.facility!=='All facilities'&&!data.facilities.some(f=>f.name===state.facility))state.facility='All facilities';save();render();notify('Record deleted')}
function notify(msg){let el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(notify.timer);notify.timer=setTimeout(()=>el.classList.remove('show'),3100)}
function download(filename,type,body){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([body],{type}));a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),500)}
function exportCSV(key){let rows=F(key),headers=SCHEMA[key].columns.map(c=>c[0]);let quote=x=>{let s=String(x??'');if(/^[=+@\-\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};let csv=[headers.map(quote).join(','),...rows.map(r=>headers.map(h=>quote(r[h])).join(','))].join('\r\n');download('health-data-'+key+'.csv','text/csv;charset=utf-8','\uFEFF'+csv);notify('CSV downloaded')}
function exportJSON(){download('greylad-health-data-demo.json','application/json',JSON.stringify({metadata:{prototype:'Uganda Health Data Platform',fictional:true,exportedAt:new Date().toISOString()},data},null,2));notify('Backup downloaded')}
function resetDemo(){if(!confirm('Reset all local demo records to the original fictional dataset?'))return;data=structuredClone(initial);state.facility='All facilities';save();render();notify('Demo restored')}
window.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
render();
</script></body></html>
